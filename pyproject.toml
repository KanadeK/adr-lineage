[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-lineage"
version = "0.1.1"
description = "Audit and resolve architecture decision replacement chains offline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
adr-lineage = "adr_lineage.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/adr-lineage"
Issues = "https://github.com/KanadeK/adr-lineage/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
